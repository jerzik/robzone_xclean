name: Release v2.1.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2.1.1.yml"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: home-assistant/actions/hassfest@ab22029681aa532bfe7de5774a9972d67bfbd2c0

  release:
    name: Publish v2.1.1
    needs: [hacs, hassfest]
    if: ${{ success() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify exact version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/robzone_xclean/manifest.json"))["version"])')"
          test "$version" = "2.1.1"

      - name: Build and verify HACS archive
        shell: bash
        run: |
          cd custom_components/robzone_xclean
          zip -r ../../robzone_xclean.zip .
          cd ../..
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("robzone_xclean.zip") as archive:
              names = archive.namelist()
          assert "manifest.json" in names
          assert "const.py" in names
          assert not any(name.startswith("custom_components/") for name in names)
          print("HACS archive layout OK")
          PY

      - name: Publish exact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "v2.1.1" >/dev/null 2>&1; then
            echo "Release v2.1.1 already exists."
            exit 0
          fi
          gh release create "v2.1.1" robzone_xclean.zip \
            --target main \
            --title "v2.1.1" \
            --notes-file RELEASE_NOTES.md
