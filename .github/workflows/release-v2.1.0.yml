name: Release v2.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2.1.0.yml"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: home-assistant/actions/hassfest@ab22029681aa532bfe7de5774a9972d67bfbd2c0

  release:
    name: Publish v2.1.0
    needs: [hacs, hassfest]
    if: ${{ success() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify exact version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/robzone_xclean/manifest.json"))["version"])')"
          test "$version" = "2.1.0"

      - name: Build HACS archive
        shell: bash
        run: |
          zip -r robzone_xclean.zip \
            custom_components/robzone_xclean \
            packages \
            dashboards \
            README.md CHANGELOG.md RELEASE_NOTES.md LICENSE

      - name: Publish exact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "v2.1.0" >/dev/null 2>&1; then
            echo "Release v2.1.0 already exists."
            exit 0
          fi
          gh release create "v2.1.0" robzone_xclean.zip \
            --target main \
            --title "v2.1.0" \
            --notes-file RELEASE_NOTES.md
